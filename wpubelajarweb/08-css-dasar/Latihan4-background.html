<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      background-color: #7d97d5;
      background-image: linear-gradient(to bottom, rgba(20, 34, 68, 0.9019607843137255) 50%, rgb(15 23 42 / 40%)), url(img/evaluasi.jpg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1 {
      font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: none;
      /* text-shadow: 5px 5px 0 rgb(215 215 215 / 10%); */
      background-image: linear-gradient(to right, rgb(55, 179, 251) 20%, rgb(226, 70, 221));
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(121, 228, 252, 0.5));
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
      background-color: rgb(255 255 255 / 5%);
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgb(255 255 255 / 10%);
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
    }

    span {
      color: crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(248, 50, 89)
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151 / 70%);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 20%);
      width: 30%;
      margin: 30px auto;
      padding-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Eval Diri</h1>

  <p class="quote">
   "Biarlah, mengering <span>sendiri</span>. <br>
    Menghias tubuh dan yang mengevaluasi <br>
    ragamu hanya kau <span>sendiri,</span> <br>
    mereka tak mampu."
  </p>

  <p class="credit">— Hindia (Evaluasi)</p>

</body>

</html>
