
<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Galau</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      background-color: #450753;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #8fa9df;
      text-shadow: 5px 5px 0 rgba(186, 186, 186, 0.10196078431372549);
      color: #25ace9;
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: hwb(348 5% 13%);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(221, 14, 14, 0.7019607843137254);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>fase runtuh</h1>

  <p class="quote">
        "Biarlah, mengering <span>sendiri</span>. <br>
        Menghias tubuh dan yang mengevaluasi <br>
        ragamu hanya kau <span>sendiri,</span> <br>
        mereka tak mampu."
  </p>

  <p class="credit">— Hindia (Evaluasi)</p>

</body>

</html>
